name: my-agent

x-backend: &backend
  image: my-agent-api:local
  build:
    context: ..
    dockerfile: docker/api/Dockerfile
  environment:
    TZ: ${TZ:-Asia/Shanghai}
    DB_META_HOST: mysql
    DB_META_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    DB_APP_HOST: mysql
    DB_APP_USER: didilili
    DB_APP_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    DB_DW_HOST: mysql
    DB_DW_USER: dw_reader
    DB_DW_PASSWORD: ${DW_QUERY_PASSWORD:?Set DW_QUERY_PASSWORD in .env}
    QDRANT_HOST: qdrant
    ES_HOST: elasticsearch
    EMBEDDING_HOST: embedding
    EMBEDDING_PORT: "80"
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_BASE_URL: ${LLM_BASE_URL:-https://api.siliconflow.cn/v1}
    LLM_MODEL: ${LLM_MODEL:-Pro/zai-org/GLM-5.1}
  depends_on:
    mysql:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
    qdrant:
      condition: service_started
    embedding:
      condition: service_started

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: meta
      MYSQL_USER: didilili
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DW_QUERY_PASSWORD: ${DW_QUERY_PASSWORD:?Set DW_QUERY_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h127.0.0.1 -u\"$$MYSQL_USER\" --database=meta -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  elasticsearch:
    build: ./elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.10
    restart: unless-stopped
    environment:
      SERVER_HOST: "0.0.0.0"
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
      I18N_LOCALE: zh-CN
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    volumes:
      - kibana_data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/share/kibana/node/bin/node", "-e", "require('http').get('http://127.0.0.1:5601/api/status', r => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  qdrant:
    image: qdrant/qdrant:v1.16
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64
    restart: unless-stopped
    command: ["--model-id", "/models/bge-large-zh-v1.5"]
    environment:
      MAX_CONCURRENT_REQUESTS: "16"
      MAX_BATCH_TOKENS: "16384"
    volumes:
      - embedding_models:/models:ro

  api:
    <<: *backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 240s

  web:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # 工具服务仅在显式指定时运行。
  metadata-init:
    <<: *backend
    profiles: ["tools"]
    command: ["sh", "-c", "python -m app.scripts.wait_for_services && exec python -m app.scripts.build_meta_knowledge -c conf/meta_config.yaml"]

  model-download:
    image: my-agent-api:local
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    profiles: ["tools"]
    user: "0:0"
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_TOKEN: ${HF_TOKEN:-}
    command: ["hf", "download", "BAAI/bge-large-zh-v1.5", "--revision", "${EMBEDDING_REVISION:-main}", "--local-dir", "/models/bge-large-zh-v1.5"]
    volumes:
      - embedding_models:/models

volumes:
  mysql_data:
  es_data:
  kibana_data:
  qdrant_data:
  embedding_models:
